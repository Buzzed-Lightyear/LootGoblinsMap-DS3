name: CI

# Build and test on every push and pull request. The runner has no game files: everything
# here works on synthetic data, and the guard makes sure no game data is ever tracked.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # GitHub-owned actions only, pinned to a commit.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Game-data guard
        shell: pwsh
        run: ./tools/check-no-game-data.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build LootGoblinsMap.slnx -c Release

      - name: Test
        run: dotnet test LootGoblinsMap.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Package and smoke-test (not published)
        shell: pwsh
        run: ./tools/package.ps1 -Version 0.0.0-ci
